[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' https://cdn.emulatorjs.org blob: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://cdn.emulatorjs.org; img-src 'self' data: blob: https://raw.githubusercontent.com https://cdn.emulatorjs.org; connect-src 'self' blob: https://cdn.emulatorjs.org https://raw.githubusercontent.com https://extendsclass.com https://ntfy.sh https://keyvalue.immanuel.co; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' blob:; media-src 'self' blob: data:; font-src 'self' data: https://cdn.emulatorjs.org; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
